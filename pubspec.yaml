name: aura_app
description: "The official application for the aura network."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  aura_dart:
    git:
      url: https://github.com/kyber-technologies/aura_proto.git
      path: aura_dart
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  flutter_hooks: ^0.21.3+1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  logger: ^2.7.0
  package_info_plus: ^9.0.1
  grpc: ^5.1.0
  dart_jsonwebtoken: ^3.4.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  hooks_riverpod: ^3.3.1
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  flutter_screenutil_plus: ^1.6.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  riverpod_lint: ^3.1.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
